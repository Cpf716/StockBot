openapi: 3.0.2
info:
  description: "List of APIs exposed by the test server"
  version: "1.0.0"
  title: "Test API Server"

paths:
  "/api/auth/login":
    post:
      summary: Returns a JWT access token
      operationId: logIn
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: string
                password:
                  type: string
              required:
                - user
                - password
      responses:
        "200":
          description: Successful request

  "/api/auth/refresh":
    post:
      summary: Refreshes auth tokens and returns a new access token
      operationId: refresh
      responses:
        "200":
          description: Successful request

  "/api/auth/register":
    post:
      summary: Creates a new user in the DB
      operationId: register
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: string
                password:
                  type: string
              required:
                - user
                - password
      responses:
        "200":
          description: Successful request

  "/api/auth/logout":
    delete:
      summary: Blacklists a refresh token
      operationId: logOut
      responses:
        "200":
          description: Successful request

  "/api/stocks":
    get:
      summary: Returns the quote for a given U.S. stock symbol
      operationId: getQuote
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful request

  "/api/users/validate":
    get:
      summary: Validates user input
      operationId: validateUser
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful request
